const DATA=[{"s": "E1", "t": "Citations", "d": "Scientifique", "v": {"Citation": "\"L'EPS est la discipline du corps, par le corps, pour le corps\"", "Auteur": "Lebreton", "Date": "1991"}}, {"s": "E1", "t": "Citations", "d": "Scientifique", "v": {"Citation": "\"L'EP est assise entre deux chaises, les pratiques sociales de référence et l'école\"", "Auteur": "Arnaud, l'apprentissage de la citoyeneté, une finalité retrouvée pour l'EP", "Date": "2000"}}, {"s": "E1", "t": "Citations", "d": "Scientifique", "v": {"Citation": "\"Les finalités et valeures de l'EPS sont mouvantes et fluctuantes totalement liées et tributaires du contexte sociopolitique et économique\"", "Auteur": "Arnaud, l'apprentissage de la citoyeneté, une finalité retrouvée pour l'EP", "Date": "2000"}}, {"s": "E1", "t": "Citations", "d": "Scientifique", "v": {"Citation": "\"L'évolution des techniques et plus généralement des pratiques corporelles suit l'évolution de la culture t de la société d'une époque\"", "Auteur": "Vigarello, une histoire culturelle du sport. Techniques d'hier et d'aujourd'hui", "Date": "1988"}}, {"s": "E1", "t": "Citations", "d": "Scientifique", "v": {"Citation": "\"On assiste à une déréalisation des gestes, des pratiques et des techniques\"", "Auteur": "Vigarello, une histoire culturelle du sport. Techniques d'hier et d'aujourd'hui", "Date": "1988"}}, {"s": "E1", "t": "Citations", "d": "Scientifique", "v": {"Citation": "Depuis les années 60 s'opère un glissement de \"l'énergétique\" à \"l'informationnel\"", "Auteur": "Parlebas, la dissipation sportive, culture et technique n°13", "Date": "1985"}}, {"s": "E1", "t": "Citations", "d": "Scientifique", "v": {"Citation": "Pour Gleyse (1992, 1993) ou encore Guigou (1987) \"il s'agit de la revendication d'une part d'animalité dans l'humanité, de nature dans la culture\"", "Auteur": "Gleyse, Une archéologie de l'EP du corps occulté à l'être humain diminué", "Date": "2022"}}, {"s": "E1", "t": "Citations", "d": "Scientifique", "v": {"Citation": "\"La domination de la machine au début du 21e siècle amène ce \"corps diminué\". Car ce n'est pas l'humain qui est augmenté, mais bien la machine qui accroit sa place en lui, la culture qui s'imisce de plus en plus intement dans la nature du corps.\"", "Auteur": "Gleyse, Une archéologie de l'EP du corps occulté à l'être humain diminué", "Date": "2022"}}, {"s": "E1", "t": "Citations", "d": "Scientifique", "v": {"Citation": "\"Comprendre s'oppose à expliquer\"", "Auteur": "Gleyse, Une archéologie de l'EP du corps occulté à l'être humain diminué", "Date": "2022"}}, {"s": "E1", "t": "Citations", "d": "Scientifique", "v": {"Citation": "Depuis les travaux de Ulmann (1989) et surtout depuis ceux de Brohm (1976) et de Pocielo (1983) il n'est plus possible de penser l'EPS hors d'un contexte culturel, social et sociologique.\"", "Auteur": "Gleyse, Une archéologie de l'EP du corps occulté à l'être humain diminué", "Date": "2022"}}, {"s": "E1", "t": "Citations", "d": "Scientifique", "v": {"Citation": "\"C'est un truisme de penser que l'histoire n'a pas de grandes lignes. Il n'y a pas de continuité comme en témoigne les changements de dénomination ou de sigles\"", "Auteur": "Gleyse, Une archéologie de l'EP du corps occulté à l'être humain diminué", "Date": "2022"}}, {"s": "E1", "t": "Citations", "d": "Scientifique", "v": {"Citation": "\"Les TO comme reflet de stabilité et de rupture des pratiques innovantes ou non\"", "Auteur": "Andrieu, l'éducation physique au 20e siècle : une histoire de pratique", "Date": "1990"}}, {"s": "E1", "t": "Citations", "d": "Scientifique", "v": {"Citation": "\"Le Boulch contre le sport et ses déviances agressives, pulsionnelles, ludiques voir hédoniques\"", "Auteur": "Gleyse, Une archéologie de l'EP du corps occulté à l'être humain diminué", "Date": "2022"}}, {"s": "E1", "t": "Citations", "d": "Scientifique", "v": {"Citation": "\"Le but fondamental de l'EPS c'est faire du corps fidèle instrument d'adaptation au milieu biologique et social par le ort ne représente rien du PIB dans les années 60. En 2010 = 2% du PIB.", "Auteur": "Pociello", "Date": "1983"}}, {"s": "E1", "t": "Citations", "d": "Scientifique", "v": {"Citation": "\"La culture provient du plaisir\"", "Auteur": "Marcuse", "Date": "1975"}}, {"s": "E1", "t": "Citations", "d": "Scientifique", "v": {"Citation": "\"Le terme de compétence est issu du monde de l'entreprise\"", "Auteur": "Le Goff, La barbarie douce", "Date": "1999"}}, {"s": "E1", "t": "Citations", "d": "Scientifique", "v": {"Citation": "\"Les modèles énergétiques et informationnels cèdent la place à une vision hédoniste de l'enseignement de l'EPS (…) le loisir et le plaisir seraient devenus de nouvelles modalités de travail\"", "Auteur": "Gleyse, Une archéologie de l'EP du corps occulté à l'être humain diminué", "Date": "2022"}}, {"s": "E1", "t": "Citations", "d": "Professionnel", "v": {"Citation": "\"L'expression du refus d'avoir une approche \"culturaliste\" à l'école, le refus de considérer les APSA comme des \"œuvres\" produites par l'histoire des hommes et devant faire l'objet d'une appropriation antique\"", "Auteur": "Becker et Fouchet, à propos des programmes 1999 ecrit par le GTD", "Date": "2000"}}, {"s": "E1", "t": "Citations", "d": "Scientifique", "v": {"Citation": "\"Diminution du terme \"pédagogie\" dans les TO passant de 43% en 1967 à 11% en 2008. Augmentation du terme \"compétence à partir des années 90, passant de 0 en 67 à 7% en 85 et + de 30% par la suite. Loi d'orientation 2013 savoir et didactique < 3 fois, mais élève = + 100 et compétence = +50.", "Auteur": "Gleyse, Une archéologie de l'EP du corps occulté à l'être humain diminué", "Date": "2022"}}, {"s": "E1", "t": "Citations", "d": "Scientifique", "v": {"Citation": "\"La notion de compétence fait concensus dans les années 2000 et jusqu'en 2008\". A contrario, la notion de plaisir est très peu utilisée. 2008 : 43 vs 1, en 2019 : 20 vs 2.", "Auteur": "Gleyse, Une archéologie de l'EP du corps occulté à l'être humain diminué", "Date": "2022"}}, {"s": "E1", "t": "Citations", "d": "Scientifique", "v": {"Citation": "\"L'EPS est bien homomorphique à l'école et au monde entrepreunarial\"", "Auteur": "Gleyse, Une archéologie de l'EP du corps occulté à l'être humain diminué", "Date": "2022"}}, {"s": "E1", "t": "Citations", "d": "Scientifique", "v": {"Citation": "\"Crosp diminué, machine augmenté. Il s'agit d'une forme hypermoderne d'eugénisme\" Sélection des corps + présence d'artefacts.", "Auteur": "Gleyse, Une archéologie de l'EP du corps occulté à l'être humain diminué", "Date": "2022"}}, {"s": "E1", "t": "Citations", "d": "Scientifique", "v": {"Citation": "\"Les nouvelles applications et technologies rationnalisent en instrumentalisant les actions de la vie quotidienne, en les sportifiants\"", "Auteur": "Gleyse, Une archéologie de l'EP du corps occulté à l'être humain diminué", "Date": "2022"}}, {"s": "E1", "t": "Citations", "d": "Scientifique", "v": {"Citation": "\"Les TO, loin de créer l'histoire, suivent des impulsions et s'adaptent aux conditions particulières du moment\"", "Auteur": "Herr, les TO et l'histoire", "Date": "1989"}}, {"s": "E1", "t": "Citations", "d": "Scientifique", "v": {"Citation": "\"L'EP est une institution complexe qui ne saurait se résoudre à des TO et des programmes\"", "Auteur": "Gleyse, L'EP au XXeme siècle. Approche historique et culturelle", "Date": "1989"}}, {"s": "E1", "t": "Citations", "d": "Scientifique", "v": {"Citation": "\"Les politiques sportives des années 70-80 (…) suscitent dans le monde de l'EPS de nombreuses réactions de méfiance et d'hostilité\"", "Auteur": "Callède in Durali et Dietch 2024", "Date": "2000"}}, {"s": "E1", "t": "Citations", "d": "Épistémologique", "v": {"Citation": "\"L'EPS deviendra une diemnsion essentielle des enseignements dispensés par l'EN\"", "Auteur": "Mitterand, 104ème proposition de son programme", "Date": "1981"}}, {"s": "E1", "t": "Citations", "d": "Scientifique", "v": {"Citation": "Bac 1983 : \"Désormais l'évaluation se veut plus qualitative mais également plus éducative et intégrant participation et progrès (…) le processus et le produit\"", "Auteur": "Durali et Dietch, Une histoire politique de l'EPS", "Date": "2024"}}, {"s": "E1", "t": "Citations", "d": "Épistémologique", "v": {"Citation": "L'EPS et le sport scolaire \" contribuent à la rénovation du systèmpe éducatif, à la lutte contre l'échec scolaire et à la réduction des inégalités sociales et culturelles\"", "Auteur": "Loi Avice", "Date": "1984"}}, {"s": "E1", "t": "Citations", "d": "Institutionnel", "v": {"Citation": "\"Permettre à l'élève d'acquérir le goût de la pratique physique, le sens de l'effort et le plaisir d'agir\"", "Auteur": "Programmes 3ème", "Date": "1998"}}, {"s": "E1", "t": "Citations", "d": "Scientifique", "v": {"Citation": "Depuis la réintégration de l'EPS à l'EN : \" Il devient nécessaire de produire une réflexion didactique en phase avec les prescriptions ministérielles, dont l'enjeu principal est de renforcer la lutte contre l'échec scolaire\"", "Auteur": "Durali et Dietch, Une histoire politique de l'EPS", "Date": "2024"}}, {"s": "E1", "t": "Citations", "d": "Scientifique", "v": {"Citation": "Après les années 80-90 : \"La discipline est donc le théatre d'une pluralité de positions et de conceptions par rapport au sport\"", "Auteur": "Durali et Dietch, Une histoire politique de l'EPS", "Date": "2024"}}, {"s": "E1", "t": "Citations", "d": "Institutionnel", "v": {"Citation": "\"Il existe dans notre société une pratique très répendue des APS. Cette pratique est diversifiée et se donne des buts différents : sport, compétition, détente, expression, entretien, etc.\"", "Auteur": "IO collège", "Date": "1985"}}, {"s": "E1", "t": "Citations", "d": "Scientifique", "v": {"Citation": "\"Ce projet de liberation et de valorisation de soi peut ainsi être considéré comme un idéal social de masse, en lien avec un \"individualisme entrepreunarial\" (Erhenberg, 1991, Le culte de la performance)\"", "Auteur": "Dur function drawF(){const cols=[...new Set([...TYPES[E.t].c,...Object.keys(E.v)])];
$("#dlg").innerHTML=`<h2>${E.id?"Modifier":"Ajouter"} une fiche</h2><div class="row">${sel(0,[["E1","E1"],["E2","E2"]],E.s,"E.s=this.value")}${sel(0,Object.entries(TYPES).map(([k,v])=>[k,v.l]),E.t,"E.t=this.value;drawF()")}${sel(0,[["","(sans domaine)"],...DOMS.map(d=>[d,d])],E.d,"E.d=this.value")}</div>${cols.map(k=>`<label>${esc(k)}<textarea rows="${k==="Citation"?4:1}" data-k="${esc(k)}" oninput="E.v[this.dataset.k]=this.value">${esc(E.v[k]||"")}</textarea></label>`).join("")}<div class="row" style="margin-top:14px"><button class="p" onclick="saveF()">Enregistrer</button><button class="s" onclick="$('#dlg').close()">Annuler</button></div>`}
function saveF(){const v={};for(const k in E.v)if(String(E.v[k]).trim())v[k]=E.v[k].trim();if(!Object.keys(v).length)return toast("Remplis au moins un champ");
if(E.id){Object.assign(S.items.find(x=>x.id===E.id),{s:E.s,t:E.t,d:E.d,v})}else S.items.push({s:E.s,t:E.t,d:E.d,v,id:uid({s:E.s,t:E.t,v},new Set(S.items.map(i=>i.id)))});save();$("#dlg").close();toast("Fiche enregistrée ✅");go(tab)}
function del(id){if(!confirm("Supprimer cette fiche ?"))return;S.items=S.items.filter(i=>i.id!==id);delete S.prog[id];save();list()}
/* ---------- DONNEES ---------- */
function data(){$("#v").innerHTML=`<div class="card"><h2>Excel</h2><p class="mu">Importe ton fichier (une feuille par type, nommée E1_Citations, E2_Tensions…). « Remplacer tout » met l’appli exactement à l’image de ton Excel (ajouts, corrections, suppressions) et garde la progression des fiches inchangées.</p><select id="md"><option value="rep">Remplacer tout (Excel = référence)</option><option value="add">Ajouter seulement les nouvelles</option></select><input type="file" id="fi" accept=".xlsx,.xls" onchange="imp(this.files[0])"><div class="row"><button class="p" onclick="expX()">⬇ Exporter en .xlsx</button></div></div>
<div class="card"><h2>Sauvegarde complète</h2><p class="mu">Tes fiches et ta progression sont gardées dans ce navigateur. Fais une sauvegarde de temps en temps (flamme et progression incluses).</p><input type="file" id="fj" accept=".json" onchange="impJ(this.files[0])"><div class="row"><button class="s" onclick="dl('revisions.json',JSON.stringify(S))">⬇ Sauvegarde .json</button><button class="s" onclick="if(confirm('Remettre la progression et la flamme à zéro ?')){S.prog={};S.st={n:0,last:'',best:0,days:{}};S.xp=0;S.done={};save();hdr();toast('Progression remise à zéro')}">↺ Réinitialiser la progression</button></div></div>`}
async function dl(name,d){if(typeof claude==="undefined"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([d]));a.download=name;document.body.appendChild(a);a.click();a.remove();return}try{const c=await claude.use("downloads");if(!c)return toast("Téléchargement indisponible ici");await c.save({filename:name,data:new Blob([d])})}catch(e){if(e?.code!=="declined")toast("Export impossible")}}
function expX(){const wb=XLSX.utils.book_new(),g={};S.items.forEach(i=>(g[i.s+"_"+i.t]??=[]).push(i));for(const[n,a]of Object.entries(g)){const c=[...new Set(a.flatMap(i=>Object.keys(i.v)))];XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(a.map(i=>({Section:i.s,...Object.fromEntries(c.map(k=>[k,i.v[k]||""])),Domaine:i.d})),{header:["Section",...c,"Domaine"]}),n.slice(0,31))}dl("base_de_donnees_E1_E2.xlsx",XLSX.write(wb,{type:"array",bookType:"xlsx"}))}
async function imp(f){if(!f)return;const rep=$("#md").value==="rep",old=S.items.map(i=>i.id),keep=S.items;if(rep&&!confirm("Remplacer toutes les fiches par celles du fichier Excel ? Les fiches créées uniquement dans l’appli seront supprimées."))return;const wb=XLSX.read(await f.arrayBuffer());if(rep)S.items=[];const ids=new Set(S.items.map(i=>i.id));let n=0;
for(const sn of wb.SheetNames){const m=sn.match(/^(E[12])_(\w+)$/);if(!m||!TYPES[m[2]])continue;for(const r of XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:"",raw:false})){const v={};for(const k in r)if(k!=="Section"&&k!=="Domaine"&&String(r[k]).trim())v[k]=String(r[k]).trim();if(!Object.keys(v).length||Object.values(v).some(x=>/^(Exemple|Nom de l.auteur|Pôle [AB]|Événement 1|Épreuve 1|Catégorie 1|Niveau 1|Élément 1)/.test(x)))continue;const it={s:m[1],t:m[2],d:r.Domaine||"",v},h=hash(it.s+it.t+Object.values(v).slice(0,2).join("|"));if(ids.has(h))continue;it.id=uid(it,ids);S.items.push(it);n++}}
if(rep&&!n){S.items=keep;return toast("Aucune feuille valide (noms attendus : E1_Citations…)")}let msg=`${n} fiche${n>1?"s":""} importée${n>1?"s":""}`;if(rep){const nw=new Set(S.items.map(i=>i.id)),gone=old.filter(i=>!nw.has(i)).length;for(const k in S.prog)if(!nw.has(k))delete S.prog[k];msg+=` · ${gone} retirée${gone>1?"s":""}`}save();toast(msg);data()}
async function impJ(f){if(!f)return;try{const j=JSON.parse(await f.text());if(!j.items)throw 0;S=j;save();hdr();toast("Sauvegarde restaurée ✅");go("home")}catch(e){toast("Fichier invalide")}}
hdr();go("home");
</script></body></html>
